name: precommit-guard
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build -o precommit-guard ./cmd/precommit-guard
      - run: go vet -vettool="$(pwd)/precommit-guard" ./...
